name: Build Cultivation Legacy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set 1.1.x build version
        shell: bash
        run: |
          VERSION="1.1.${GITHUB_RUN_NUMBER}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          mvn -B versions:set \
            -DnewVersion="${VERSION}" \
            -DgenerateBackupPoms=false

      - name: Build shaded JAR
        run: mvn -B clean package -DskipTests

      - name: Prepare named JAR
        shell: bash
        run: |
          mkdir -p dist
          JAR="$(find target -maxdepth 1 -type f -name '*.jar' \
            ! -name 'original-*' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -print -quit)"

          if [ -z "$JAR" ]; then
            echo "No built plugin JAR was found in target/."
            exit 1
          fi

          OUTPUT="dist/SF_Cultivation${VERSION}.jar"
          cp "$JAR" "$OUTPUT"
          echo "OUTPUT_JAR=$OUTPUT" >> "$GITHUB_ENV"
          echo "Built $OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SF_Cultivation${{ env.VERSION }}
          path: ${{ env.OUTPUT_JAR }}
          if-no-files-found: error
          compression-level: 0

      - name: Publish direct JAR release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "v${VERSION}" "$OUTPUT_JAR" \
            --title "SF Cultivation Legacy ${VERSION}" \
            --notes "AlbionMC Cultivation Legacy build ${VERSION}. Custom Cultivation plants can grow on farmland without Crop Sticks; Crop Sticks remain supported for advanced Cultivation mechanics and breeding."
