name: Build Cultivation

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "1.1.24"
  OUTPUT_NAME: "SF_Cultivation1.1.24.jar"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 25 compiler
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify canonical release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          test "$OUTPUT_NAME" = "SF_Cultivation${VERSION}.jar"
          test "$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" = "$VERSION"
          grep -Fq '<finalName>SF_Cultivation${project.version}</finalName>' pom.xml
          if printf '%s\n%s\n' "$VERSION" "$OUTPUT_NAME" | grep -Eiq '(legacy|english|snapshot)'; then exit 1; fi
          test -s "docs/releases/${VERSION}.md"

      - name: Verify English source policy
        shell: python
        run: |
          from pathlib import Path
          import re
          cjk = re.compile(r'[\u4e00-\u9fff]')
          blocked = ('SlimefunGuguProject', 'guizhanss', 'GuizhanLibPlugin')
          failures = []
          for path in list(Path('src/main/java').rglob('*.java')) + list(Path('src/main/resources').rglob('*')):
              if not path.is_file(): continue
              try: text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              if cjk.search(text): failures.append(f'{path}: non-English text')
              if any(term.lower() in text.lower() for term in blocked): failures.append(f'{path}: forbidden dependency/reference')
          if failures:
              print('\n'.join(failures))
              raise SystemExit(1)

      - name: Install Slimefun Legacy build dependency
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-deps
          gh release download "v4.1.78" --repo "wickidcow/Slimefun-Legacy" --pattern "Slimefun-Legacy4.1.78.jar" --dir ".ci-deps"
          mvn -B install:install-file -Dfile=".ci-deps/Slimefun-Legacy4.1.78.jar" -DgroupId="com.github.slimefun" -DartifactId="Slimefun" -Dversion="4.1.78" -Dpackaging="jar" -DgeneratePom=true

      - name: Verify player data preservation boundary
        run: python3 scripts/verify_player_data_safety.py
      - name: Test zero-deprecation regression guard
        run: python3 -m unittest discover -s scripts -p 'test_deprecation_baseline.py' -v
      - name: Build and test universal release JAR on 1.21.11 baseline
        shell: bash
        run: |
          set -euo pipefail
          mvn -B clean package 2>&1 | tee "${RUNNER_TEMP}/cultivation-deprecation-1.21.11.log"
          python3 scripts/verify_deprecation_baseline.py "${RUNNER_TEMP}/cultivation-deprecation-1.21.11.log"
      - name: Retain Java regression test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: player-data-test-evidence
          path: target/surefire-reports/TEST-*.xml
          if-no-files-found: warn
      - name: Stage release JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR="target/${OUTPUT_NAME}"
          test -s "$JAR"
          cp "$JAR" "dist/${OUTPUT_NAME}"
          unzip -tqq "dist/${OUTPUT_NAME}"
          PLUGIN_VERSION=$(unzip -p "dist/${OUTPUT_NAME}" plugin.yml | awk -F': *' '/^version:/ {gsub(/["'"'"']/,"",$2); print $2; exit}')
          test "$PLUGIN_VERSION" = "$VERSION"
          if printf '%s\n' "$PLUGIN_VERSION" | grep -Eiq '(legacy|english|snapshot)'; then exit 1; fi
          sha256sum "dist/${OUTPUT_NAME}"
      - name: Verify Java 21 bytecode
        shell: bash
        run: |
          set -euo pipefail
          MAIN_CLASS=$(unzip -p "dist/${OUTPUT_NAME}" plugin.yml | awk '/^main:/ {print $2; exit}')
          javap -verbose -classpath "dist/${OUTPUT_NAME}" "$MAIN_CLASS" | grep -F 'major version: 65'
      - name: Verify Paper 26.1 compilation
        shell: bash
        run: |
          set -euo pipefail
          mvn -B clean package -DskipTests -Dserver.api.group=io.papermc.paper -Dserver.api.artifact=paper-api "-Dserver.api.version=[26.1.build,26.2)" 2>&1 | tee "${RUNNER_TEMP}/cultivation-deprecation-26.1.log"
          python3 scripts/verify_deprecation_baseline.py "${RUNNER_TEMP}/cultivation-deprecation-26.1.log"
      - name: Verify Paper 26.2 compilation
        shell: bash
        run: |
          set -euo pipefail
          mvn -B clean package -DskipTests -Dserver.api.group=io.papermc.paper -Dserver.api.artifact=paper-api "-Dserver.api.version=[26.2.build,26.3)" 2>&1 | tee "${RUNNER_TEMP}/cultivation-deprecation-26.2.log"
          python3 scripts/verify_deprecation_baseline.py "${RUNNER_TEMP}/cultivation-deprecation-26.2.log"
      - name: Verify Paper 26.3 stable compilation
        shell: bash
        run: |
          set -euo pipefail
          mvn -B clean package -DskipTests -Dserver.api.group=io.papermc.paper -Dserver.api.artifact=paper-api "-Dserver.api.version=[26.3.build,26.4)" 2>&1 | tee "${RUNNER_TEMP}/cultivation-deprecation-26.3.log"
          python3 scripts/verify_deprecation_baseline.py "${RUNNER_TEMP}/cultivation-deprecation-26.3.log"
      - name: Retain compiler deprecation audit logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cultivation-compiler-deprecation-audit
          path: ${{ runner.temp }}/cultivation-deprecation-*.log
          if-no-files-found: warn

      # These tests also run on release-producing pushes, not only pull requests.
      - name: Download checksum-verified stable Paper runtimes
        shell: bash
        run: |
          bash scripts/download_paper.sh 1.21.11 .ci-runtime/paper-1.21.11.jar
          bash scripts/download_paper.sh 26.3 .ci-runtime/paper-26.3.jar
      - name: Set up Java 21 minimum runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Paper 1.21.11 packaged-addon integration and recovery tests
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/paper_startup_smoke.py \
            .ci-runtime/paper-1.21.11.jar \
            .ci-deps/Slimefun-Legacy4.1.78.jar \
            "dist/${OUTPUT_NAME}" \
            .ci-runtime/server-1.21.11
      - name: Restore Java 25 for Paper 26.3
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Paper 26.3 packaged-addon integration and recovery tests
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/paper_startup_smoke.py \
            .ci-runtime/paper-26.3.jar \
            .ci-deps/Slimefun-Legacy4.1.78.jar \
            "dist/${OUTPUT_NAME}" \
            .ci-runtime/server-26.3
      - name: Retain disposable Paper runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cultivation-paper-runtime-evidence
          path: |
            .ci-runtime/*.metadata.json
            .ci-runtime/server-*/cultivation-boot-*.stdout.log
            .ci-runtime/server-*/plugins/Cultivation/exp.yml
            .ci-runtime/server-*/plugins/Cultivation/codex.yml
            .ci-runtime/server-*/plugins/CultivationRuntimeProbe/seed-pack.bin
          if-no-files-found: warn
      - name: Upload validated canonical raw JAR
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish canonical raw JAR release
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref_name == github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "$TAG"; fi
          # Previously published versions are never replaced by subsequent CI runs.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; leaving its files unchanged."
          else
            gh release create "$TAG" "dist/${OUTPUT_NAME}" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Cultivation ${VERSION}" --notes-file "docs/releases/${VERSION}.md"
          fi
