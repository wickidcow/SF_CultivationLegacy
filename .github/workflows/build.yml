name: Build Cultivation Legacy

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify English and Legacy source policy
        shell: python
        run: |
          from pathlib import Path
          import re
          cjk = re.compile(r'[\u4e00-\u9fff]')
          blocked = ('SlimefunGuguProject', 'guizhanss', 'GuizhanLibPlugin')
          failures = []
          for path in list(Path('src/main/java').rglob('*.java')) + list(Path('src/main/resources').rglob('*')):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if cjk.search(text): failures.append(f'{path}: non-English text')
              if any(term.lower() in text.lower() for term in blocked): failures.append(f'{path}: forbidden legacy dependency/reference')
          if failures:
              print('\n'.join(failures))
              raise SystemExit(1)
      - name: Install Slimefun Legacy build dependency
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p .ci-deps
          gh release download "SlimefunLegacy4.1.29B" --repo "wickidcow/Slimefun-Legacy" --pattern "Slimefun-4.1.29.jar" --dir ".ci-deps"
          mvn -B install:install-file -Dfile=".ci-deps/Slimefun-4.1.29.jar" -DgroupId="com.github.slimefun" -DartifactId="Slimefun" -Dversion="4.1.29" -Dpackaging="jar" -DgeneratePom=true
      - name: Set 1.1.x build version
        shell: bash
        run: |
          VERSION="1.1.${GITHUB_RUN_NUMBER}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          mvn -B versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false
      - name: Build shaded JAR
        run: mvn -B clean package -DskipTests
      - name: Prepare named JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          OUTPUT="dist/SF_CultivationLegacy${VERSION}.jar"
          cp "$JAR" "$OUTPUT"
          echo "OUTPUT_JAR=$OUTPUT" >> "$GITHUB_ENV"
          sha256sum "$OUTPUT"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.OUTPUT_JAR }}
          archive: false
          if-no-files-found: error
      - name: Publish raw JAR release
        if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUTPUT_JAR" --clobber
          else
            gh release create "$TAG" "$OUTPUT_JAR" --title "SF_CultivationLegacy ${VERSION}" --generate-notes
          fi
