name: Finalize Legacy Foods Compatibility

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Use Legacy-compatible modern Foods base'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize Foods source
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/main/java/dev/sefiraat/cultivation/implementation/slimefun/items/Foods.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace('PotionEffectType.DAMAGE_RESISTANCE', 'PotionEffectType.RESISTANCE')
          old = 'CultivationStacks.SAUSAGE,\n        RecipeTypes.GRILLED,'
          new = 'CultivationStacks.SAUSAGE,\n        RecipeTypes.BAKING,'
          if old not in text:
              raise SystemExit('Sausage recipe block was not found; refusing to make an unsafe edit.')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit finalized source and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/modernize-foods-once.yml
          git add src/main/java/dev/sefiraat/cultivation/implementation/slimefun/items/Foods.java
          git commit -m "Finalize Legacy-compatible Foods API"
          git push origin HEAD:main
