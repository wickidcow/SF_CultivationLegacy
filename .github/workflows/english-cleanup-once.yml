name: Conservative English Source Cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run conservative English source cleanup'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Fetch English donor forks
        shell: bash
        run: |
          git clone --depth 1 https://github.com/galagpanji/Cultivation.git /tmp/cultivation-galag
          git clone --depth 1 https://github.com/BLACKGAMER1221/Cultivation.git /tmp/cultivation-black
          git clone --depth 1 https://github.com/Sefiraat/Cultivation.git /tmp/cultivation-upstream

      - name: Restore English literals conservatively
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          donors = [
              Path('/tmp/cultivation-galag'),
              Path('/tmp/cultivation-black'),
              Path('/tmp/cultivation-upstream'),
          ]

          string_re = re.compile(r'"(?:\\.|[^"\\])*"')
          cjk_re = re.compile(r'[\u4e00-\u9fff]')

          explicit_literals = {
              '"副产品"': '"By-Products"',
              '"植物宝典"': '"Plants Codex"',
              '"切碎的"': '"Chopped "',
              '"捣碎的"': '"Mashed "',
              '"切片的"': '"Sliced "',
              '"剁碎的"': '"Ground "',
              '"搅拌的"': '"Blended "',
              '"煮熟的"': '"Boiled "',
              '"油炸的"': '"Fried "',
              '"烤制的"': '"Grilled "',
              '"目前收集的种子："': '"Stored Seed Type: "',
              '"取出种子："': '"Remove Seed: "',
          }

          for path in Path('src/main/java').rglob('*.java'):
              text = path.read_text(encoding='utf-8')
              replaced = text
              for old, new in explicit_literals.items():
                  replaced = replaced.replace(old, new)
              if replaced != text:
                  path.write_text(replaced, encoding='utf-8')

          def literal_has_cjk(line: str) -> bool:
              return any(cjk_re.search(m.group(0)) for m in string_re.finditer(line))

          def normalize(line: str) -> str:
              return string_re.sub('""', line).strip()

          unresolved = []
          changed_files = []

          for current_path in sorted(Path('src/main/java').rglob('*.java')):
              lines = current_path.read_text(encoding='utf-8').splitlines(keepends=True)
              if not any(literal_has_cjk(line) for line in lines):
                  continue

              rel = current_path.relative_to(root)
              donor_sets = []
              for donor_root in donors:
                  donor_path = donor_root / rel
                  if donor_path.exists():
                      donor_sets.append(donor_path.read_text(encoding='utf-8').splitlines(keepends=True))

              out = list(lines)
              file_changed = False

              for idx, line in enumerate(lines):
                  if not literal_has_cjk(line):
                      continue

                  target = normalize(line)
                  candidates = []

                  for donor_lines in donor_sets:
                      for donor_idx, donor_line in enumerate(donor_lines):
                          if literal_has_cjk(donor_line) or normalize(donor_line) != target:
                              continue

                          score = 0
                          for delta in (-3, -2, -1, 1, 2, 3):
                              ci = idx + delta
                              di = donor_idx + delta
                              if 0 <= ci < len(lines) and 0 <= di < len(donor_lines):
                                  if normalize(lines[ci]) == normalize(donor_lines[di]):
                                      score += 1
                          candidates.append((score, donor_line))

                  if not candidates:
                      unresolved.append(f'{current_path}:{idx + 1}: {line.strip()}')
                      continue

                  best_score = max(score for score, _ in candidates)
                  best_lines = {candidate for score, candidate in candidates if score == best_score}
                  if len(best_lines) != 1:
                      unresolved.append(f'{current_path}:{idx + 1}: ambiguous: {line.strip()}')
                      continue

                  replacement = next(iter(best_lines))
                  indent = line[:len(line) - len(line.lstrip())]
                  replacement = indent + replacement.lstrip()
                  out[idx] = replacement
                  file_changed = True

              if file_changed:
                  current_path.write_text(''.join(out), encoding='utf-8')
                  changed_files.append(str(current_path))

          remaining = []
          for path in sorted(Path('src/main/java').rglob('*.java')):
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if literal_has_cjk(line):
                      remaining.append(f'{path}:{number}: {line.strip()}')

          if unresolved or remaining:
              print('Unresolved English-literal cleanup:')
              for entry in sorted(set(unresolved + remaining)):
                  print(entry)
              raise SystemExit(1)

          print('All Java string literals are free of CJK localization text.')

          pom = Path('pom.xml')
          pom_text = pom.read_text(encoding='utf-8')
          marker = '                                <exclude>META-INF/*</exclude>'
          replacement = marker + '\n                                <exclude>acf-core_*.properties</exclude>\n                                <exclude>acf-minecraft_*.properties</exclude>'
          if 'acf-core_*.properties' not in pom_text:
              if marker not in pom_text:
                  raise SystemExit('Maven shade filter marker was not found.')
              pom.write_text(pom_text.replace(marker, replacement, 1), encoding='utf-8')

      - name: Install Slimefun Legacy build dependency
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p .ci-deps
          gh release download "SlimefunLegacy4.1.29B" \
            --repo "wickidcow/Slimefun-Legacy" \
            --pattern "Slimefun-4.1.29.jar" \
            --dir ".ci-deps"

          mvn -B install:install-file \
            -Dfile=".ci-deps/Slimefun-4.1.29.jar" \
            -DgroupId="com.github.slimefun" \
            -DartifactId="Slimefun" \
            -Dversion="4.1.29" \
            -Dpackaging="jar" \
            -DgeneratePom=true

      - name: Verify cleaned source builds
        run: mvn -B clean package -DskipTests

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/english-cleanup-once.yml
          git add src/main/java pom.xml
          git commit -m "Restore English Cultivation UI strings"
          git push origin HEAD:main
